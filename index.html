<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soldertronics - Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000;
      --surface: #111;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.14);
      --text-primary: #f5f5f7;
      --text-secondary: rgba(245,245,247,0.55);
      --text-tertiary: rgba(245,245,247,0.32);
      --accent: #f5f5f7;
      --accent-dim: rgba(245,245,247,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 3rem;
      height: 52px;
      background: rgba(0,0,0,0.72);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
      opacity: 0;
      animation: fade-in 0.6s ease forwards 0.1s;
    }

    .nav-logo {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-primary);
    }

    .nav-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: 0.01em;
    }

    .nav-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--text-primary);
      opacity: 0.7;
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50%       { opacity: 0.2; }
    }

    /* ── PAGE ── */
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5rem 3rem 4rem;
    }

    /* ── LAYOUT ── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6rem;
      align-items: center;
      max-width: 1040px;
      width: 100%;
    }

    /* ── LEFT CONTENT ── */
    .content {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .eyebrow {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
      opacity: 0;
      animation: slide-up 0.6s ease forwards 0.4s;
    }

    .headline {
      font-size: clamp(2.8rem, 5vw, 4.8rem);
      font-weight: 600;
      line-height: 1.02;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      opacity: 0;
      animation: slide-up 0.6s ease forwards 0.55s;
    }

    .headline em {
      font-style: normal;
      color: var(--text-secondary);
    }

    .subline {
      font-size: 0.95rem;
      font-weight: 300;
      line-height: 1.7;
      color: var(--text-secondary);
      max-width: 36ch;
      opacity: 0;
      animation: slide-up 0.6s ease forwards 0.7s;
    }

    /* ── DIVIDER ── */
    .divider {
      width: 32px;
      height: 1px;
      background: var(--border-strong);
      opacity: 0;
      animation: slide-up 0.6s ease forwards 0.8s;
    }

    /* ── SOCIAL ── */
    .social-wrap {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      opacity: 0;
      animation: slide-up 0.6s ease forwards 0.9s;
    }

    .social-label {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--text-tertiary);
      text-transform: uppercase;
    }

    .social-links {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.5rem 0.9rem;
      border-radius: 980px;
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .social-btn:hover {
      background: var(--accent-dim);
      border-color: rgba(255,255,255,0.28);
      color: var(--text-primary);
    }

    .social-btn svg {
      width: 13px; height: 13px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* ── iPOD SIDE ── */
    .ipod-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      animation: fade-in 1s ease forwards 0.6s;
    }

    .ipod-svg {
      width: min(300px, 86vw);
      filter: drop-shadow(0 40px 80px rgba(255,255,255,0.06)) drop-shadow(0 2px 8px rgba(0,0,0,0.8));
    }

    /* Wheel spin */
    .wheel-ring {
      transform-origin: 140px 310px;
      animation: slow-spin 22s linear infinite;
    }

    @keyframes slow-spin {
      to { transform: rotate(360deg); }
    }

    /* Screen flicker-on */
    .screen-g {
      opacity: 0;
      animation: screen-on 1.2s ease forwards 1.4s;
    }

    @keyframes screen-on {
      0%   { opacity: 0; }
      25%  { opacity: 0.5; }
      40%  { opacity: 0.1; }
      100% { opacity: 1; }
    }

    /* ── FOOTER ── */
    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 3rem;
      height: 44px;
      border-top: 1px solid var(--border);
      opacity: 0;
      animation: fade-in 0.6s ease forwards 1.2s;
      background: rgba(0,0,0,0.72);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid var(--border);
    }

    footer span {
      font-size: 0.65rem;
      color: var(--text-tertiary);
    }

    footer nav {
      position: static;
      height: auto;
      padding: 0;
      background: transparent;
      backdrop-filter: none;
      border: none;
      gap: 2rem;
      opacity: 1;
      animation: none;
    }

    footer nav a {
      font-size: 0.65rem;
      color: var(--text-tertiary);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer nav a:hover { color: var(--text-primary); }

    /* ── KEYFRAMES ── */
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes slide-up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 780px) {
      nav, footer { padding: 0 1.5rem; }

      .page { padding: 5rem 1.5rem 4rem; }

      .grid {
        grid-template-columns: 1fr;
        gap: 3.5rem;
        text-align: center;
      }

      .content { align-items: center; }
      .subline  { max-width: 100%; }
      .divider  { width: 24px; }
      .social-links { justify-content: center; }

      .ipod-wrap { order: -1; }

      footer { flex-direction: column; justify-content: center; gap: 0.25rem; height: auto; padding: 0.75rem 1.5rem; }
    }

    @media (max-width: 420px) {
      .headline { font-size: 2.4rem; }
    }
  </style>
</head>

<script>
  const target = new Date();
  target.setDate(target.getDate() + 30);
  target.setHours(0, 0, 0, 0);

  const pad = n => String(n).padStart(2, '0');

  function tick() {
    const diff = target - Date.now();
    if (diff <= 0) {
      ['s-days','s-hours','s-mins','s-secs'].forEach(id => document.getElementById(id).textContent = '00');
      return;
    }
    document.getElementById('s-days').textContent  = pad(Math.floor(diff / 86400000));
    document.getElementById('s-hours').textContent = pad(Math.floor((diff % 86400000) / 3600000));
    document.getElementById('s-mins').textContent  = pad(Math.floor((diff % 3600000) / 60000));
    document.getElementById('s-secs').textContent  = pad(Math.floor((diff % 60000) / 1000));
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
